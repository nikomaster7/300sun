<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  @font-face { font-family: "Inter"; src: url("../../site/assets/fonts/inter-var.woff2") format("woff2"); font-weight: 300 800; }
  @font-face { font-family: "Serif"; src: url("../../site/assets/fonts/instrument-serif-italic.woff2") format("woff2"); font-style: italic; }
  :root { --navy: #1e2a4a; --navy2: #2a3860; --coral: #e8664a; --yellow: #fec93b; --cream: #fdf6ee; --ink: #1e2a4a; --muted: #5d6478; --line: #ece4d8; --green: #1f7a4d; }
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1080px; background: var(--cream); }
  body { color: var(--ink); font-family: "Inter", sans-serif; -webkit-font-smoothing: antialiased; }
  .canvas { width: 1080px; position: relative; overflow: hidden; }
  .pad { padding: 0 72px; }

  /* HERO */
  .hero { background: var(--navy); color: #fff; position: relative; overflow: hidden; padding: 64px 0 96px; }
  .hero::before { content: ""; position: absolute; width: 520px; height: 520px; border-radius: 50%; background: var(--coral); top: -250px; right: -200px; }
  .hero::after { content: ""; position: absolute; width: 220px; height: 110px; border-radius: 220px 220px 0 0; background: var(--yellow); bottom: 0; right: 110px; }
  .ring { position: absolute; width: 150px; height: 150px; border-radius: 50%; border: 3px solid rgba(255,255,255,.14); top: 190px; right: 40px; }
  .hero .pad { position: relative; z-index: 1; }
  .top { display: flex; justify-content: space-between; align-items: center; }
  .logo { font: 800 40px/1 "Inter"; letter-spacing: -.025em; }
  .logo span { color: var(--yellow); }
  .kicker { margin-top: 92px; font: 700 20px/1 "Inter"; letter-spacing: .2em; color: var(--yellow); }
  h1 { margin-top: 22px; font: 800 92px/0.98 "Inter"; letter-spacing: -.045em; max-width: 820px; }
  h1 em { font: italic 400 104px/0.9 "Serif"; letter-spacing: -.01em; color: var(--yellow); }
  .sub { margin-top: 28px; font: 400 30px/1.4 "Inter"; color: #d6dae6; max-width: 640px; }
  .tags { margin-top: 40px; display: flex; flex-wrap: wrap; gap: 12px; max-width: 760px; }
  .tag { display: inline-flex; align-items: center; gap: 10px; padding: 14px 22px; border-radius: 999px; background: rgba(255,255,255,.1); border: 1.5px solid rgba(255,255,255,.18); font: 600 23px/1 "Inter"; color: #fff; }
  .tag i { width: 10px; height: 10px; border-radius: 50%; background: var(--yellow); display: inline-block; }

  /* SECTIONS */
  section { padding-top: 76px; }
  .label { display: flex; align-items: center; gap: 16px; font: 700 19px/1 "Inter"; letter-spacing: .2em; color: var(--coral); }
  .label b { font-weight: 800; color: var(--ink); opacity: .25; letter-spacing: 0; font-size: 19px; }
  .label::after { content: ""; flex: 1; height: 2px; background: var(--line); }
  h2 { margin-top: 18px; font: 800 52px/1.05 "Inter"; letter-spacing: -.035em; }
  h2 em { font: italic 400 60px/1 "Serif"; color: var(--coral); letter-spacing: 0; }

  .qs { margin-top: 36px; display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
  .q { background: #fff; border-radius: 28px; padding: 34px 32px 36px; box-shadow: 0 2px 0 var(--line), 0 18px 40px -24px rgba(30,42,74,.25); position: relative; }
  .q .mark { width: 60px; height: 60px; border-radius: 18px; background: var(--cream); display: grid; place-items: center; font: italic 400 46px/1 "Serif"; color: var(--coral); }
  .q h3 { margin-top: 26px; font: 800 33px/1.12 "Inter"; letter-spacing: -.025em; }
  .q p { margin-top: 14px; font: 400 23px/1.45 "Inter"; color: var(--muted); }
  .chips { margin-top: 20px; display: flex; flex-wrap: wrap; gap: 8px; }
  .chip { font: 600 19px/1 "Inter"; padding: 10px 14px; border-radius: 10px; background: var(--cream); color: var(--ink); }

  .steps { margin-top: 40px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 0; position: relative; }
  .steps::before { content: ""; position: absolute; top: 34px; left: 34px; right: calc(33.33% - 34px); height: 3px; background: repeating-linear-gradient(90deg, var(--coral) 0 12px, transparent 12px 22px); }
  .step { position: relative; padding-right: 26px; }
  .num { width: 68px; height: 68px; border-radius: 50%; background: var(--navy); color: #fff; display: grid; place-items: center; font: 800 28px/1 "Inter"; position: relative; z-index: 1; box-shadow: 0 0 0 8px var(--cream); }
  .step:first-child .num { background: var(--coral); }
  .step h4 { margin-top: 26px; font: 800 29px/1.15 "Inter"; letter-spacing: -.02em; }
  .step p { margin-top: 10px; font: 400 22px/1.45 "Inter"; color: var(--muted); }

  /* OFFER */
  .offer { margin-top: 76px; background: var(--navy); color: #fff; border-radius: 36px; padding: 48px 52px 52px; position: relative; overflow: hidden; }
  .offer::before { content: ""; position: absolute; width: 300px; height: 300px; border-radius: 50%; background: var(--navy2); right: -90px; top: -120px; }
  .offer > * { position: relative; }
  .offer .row { display: grid; grid-template-columns: 1fr auto; gap: 30px; align-items: end; }
  .offer .kick { font: 700 19px/1 "Inter"; letter-spacing: .2em; color: var(--yellow); }
  .offer h3 { margin-top: 18px; font: 800 44px/1.08 "Inter"; letter-spacing: -.03em; max-width: 560px; }
  .price { text-align: right; }
  .price strong { display: block; font: 800 150px/.85 "Inter"; letter-spacing: -.06em; color: var(--yellow); }
  .price span { display: block; margin-top: 14px; font: 600 22px/1.2 "Inter"; color: #c9cede; }
  .facts { margin-top: 36px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
  .fact { background: rgba(255,255,255,.07); border: 1.5px solid rgba(255,255,255,.12); border-radius: 18px; padding: 20px 20px; }
  .fact b { display: block; font: 800 27px/1.1 "Inter"; letter-spacing: -.02em; }
  .fact small { display: block; margin-top: 6px; font: 500 19px/1.3 "Inter"; color: #b8bfd2; }
  .cta { margin-top: 30px; display: flex; align-items: center; justify-content: space-between; gap: 20px; background: var(--green); border-radius: 22px; padding: 26px 32px; }
  .cta .l { font: 700 21px/1.2 "Inter"; color: #cfeedd; letter-spacing: .02em; }
  .cta .l b { display: block; margin-top: 6px; font: 800 38px/1 "Inter"; color: #fff; letter-spacing: -.02em; }
  .cta .arrow { width: 72px; height: 72px; border-radius: 50%; background: #fff; display: grid; place-items: center; flex: none; }
  .then { margin-top: 22px; font: 400 21px/1.45 "Inter"; color: #c9cede; }
  .then b { color: #fff; font-weight: 700; }

  footer { margin-top: 56px; padding: 30px 72px 44px; border-top: 2px solid var(--line); display: flex; justify-content: space-between; align-items: center; font: 500 21px/1.3 "Inter"; color: var(--muted); }
  footer .logo { font-size: 28px; color: var(--ink); }
  footer .logo span { color: var(--coral); }
</style>
</head>
<body>
<div class="canvas">
  <header class="hero">
    <div class="ring"></div>
    <div class="pad">
      <div class="top"><div class="logo">Espanglish<span>fun</span></div></div>
      <p class="kicker" data-t="kicker"></p>
      <h1 data-t="h1"></h1>
      <p class="sub" data-t="sub"></p>
      <div class="tags">
        <span class="tag"><i></i><span data-t="tag1"></span></span>
        <span class="tag"><i></i><span data-t="tag2"></span></span>
        <span class="tag"><i></i><span data-t="tag3"></span></span>
      </div>
    </div>
  </header>

  <div class="pad">
    <section>
      <p class="label"><b>01</b><span data-t="l1"></span></p>
      <h2 data-t="h2a"></h2>
      <div class="qs">
        <div class="q">
          <div class="mark">?</div>
          <h3 data-t="q1"></h3>
          <p data-t="q1p"></p>
        </div>
        <div class="q">
          <div class="mark">?</div>
          <h3 data-t="q2"></h3>
          <div class="chips" data-chips="q2c"></div>
        </div>
      </div>
    </section>

    <section>
      <p class="label"><b>02</b><span data-t="l2"></span></p>
      <h2 data-t="h2b"></h2>
      <div class="steps">
        <div class="step"><div class="num">1</div><h4 data-t="s1"></h4><p data-t="s1p"></p></div>
        <div class="step"><div class="num">2</div><h4 data-t="s2"></h4><p data-t="s2p"></p></div>
        <div class="step"><div class="num">3</div><h4 data-t="s3"></h4><p data-t="s3p"></p></div>
      </div>
    </section>

    <div class="offer">
      <div class="row">
        <div>
          <p class="kick" data-t="ok"></p>
          <h3 data-t="oh"></h3>
        </div>
        <div class="price"><strong>20 €</strong><span data-t="op"></span></div>
      </div>
      <div class="facts">
        <div class="fact"><b data-t="f1"></b><small data-t="f1s"></small></div>
        <div class="fact"><b data-t="f2"></b><small data-t="f2s"></small></div>
        <div class="fact"><b data-t="f3"></b><small data-t="f3s"></small></div>
      </div>
      <div class="cta">
        <div class="l"><span data-t="cta"></span><b>+34 615 85 80 17</b></div>
        <div class="arrow"><svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#1f7a4d" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></div>
      </div>
    </div>
  </div>

  <footer>
    <div class="logo">Espanglish<span>fun</span></div>
    <div data-t="foot"></div>
  </footer>
</div>

<script>
const T = {
  en: {
    kicker: "PRIVATE ENGLISH LESSONS · VALENCIA",
    h1: "English lessons built around <em>each</em> child.",
    sub: "Face-to-face lessons for your two kids, with a plan made for them, not a textbook.",
    tag1: "In person", tag2: "Ages 11 &amp; 8", tag3: "Palau de la Música area",
    l1: "FIRST, TWO QUESTIONS",
    h2a: "Every plan starts with <em>your</em> answers.",
    q1: "Do both kids have the same level?",
    q1p: "At 11 and 8 they often don't. It tells us whether they learn together or each at their own pace.",
    q2: "What is the goal?",
    q2c: ["School grades", "Cambridge exam", "Speaking with confidence", "Enjoying English"],
    l2: "HOW WE START",
    h2b: "Assess, plan, then teach.",
    s1: "Evaluation lesson", s1p: "We meet both kids, play, talk and test their level.",
    s2: "Personal plan", s2p: "We map out a study plan for each child and their goal.",
    s3: "Your offer", s3p: "We send a package offer with our suggestions. You decide.",
    ok: "STEP 1 · EVALUATION LESSON",
    oh: "One session for both kids, in person.",
    op: "total, both kids",
    f1: "30–40 min", f1s: "one session",
    f2: "Both kids", f2s: "one price",
    f3: "Plan + offer", f3s: "sent after",
    cta: "WhatsApp us to book",
    foot: "Lessons in person or online",
  },
  es: {
    kicker: "CLASES PARTICULARES DE INGLÉS · VALENCIA",
    h1: "Clases de inglés pensadas para <em>cada</em> niño.",
    sub: "Clases presenciales para tus dos hijos, con un plan hecho para ellos, no un libro de texto.",
    tag1: "En persona", tag2: "11 y 8 años", tag3: "Zona Palau de la Música",
    l1: "PRIMERO, DOS PREGUNTAS",
    h2a: "Cada plan empieza con <em>tus</em> respuestas.",
    q1: "¿Tienen los dos el mismo nivel?",
    q1p: "A los 11 y a los 8 años muchas veces no. Así sabemos si aprenden juntos o cada uno a su ritmo.",
    q2: "¿Qué objetivo tienen?",
    q2c: ["Notas del cole", "Examen Cambridge", "Hablar con soltura", "Disfrutar el inglés"],
    l2: "CÓMO EMPEZAMOS",
    h2b: "Evaluamos, planificamos y enseñamos.",
    s1: "Clase de evaluación", s1p: "Conocemos a los dos, jugamos, hablamos y vemos su nivel.",
    s2: "Plan personal", s2p: "Trazamos un plan de estudio para cada niño y su objetivo.",
    s3: "Tu oferta", s3p: "Te enviamos paquetes con nuestras sugerencias. Tú decides.",
    ok: "PASO 1 · CLASE DE EVALUACIÓN",
    oh: "Una sesión para los dos, en persona.",
    op: "en total, los dos",
    f1: "30–40 min", f1s: "una sesión",
    f2: "Los dos", f2s: "un solo precio",
    f3: "Plan + oferta", f3s: "te lo enviamos",
    cta: "Reserva por WhatsApp",
    foot: "Clases en persona u online",
  }
};
const lang = new URLSearchParams(location.search).get("lang") || "en";
document.documentElement.lang = lang;
const d = T[lang];
document.querySelectorAll("[data-t]").forEach(el => el.innerHTML = d[el.dataset.t]);
document.querySelectorAll("[data-chips]").forEach(el => el.innerHTML = d[el.dataset.chips].map(c => `<span class="chip">${c}</span>`).join(""));
</script>
</body>
</html>
