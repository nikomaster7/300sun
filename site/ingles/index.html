    form { padding: 24px 0 40px; display: grid; gap: 12px; }
    .plan { position: relative; display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 4px 12px; padding: 18px; background: #fff; border: 2px solid transparent; border-radius: 16px; box-shadow: 0 2px 0 var(--line); cursor: pointer; }
    .plan input { position: absolute; opacity: 0; }
    .plan:has(input:checked) { border-color: var(--coral); }
    .plan:has(input:focus-visible) { outline: 2px solid var(--navy); outline-offset: 2px; }
    .plan b { font-size: 19px; font-weight: 800; }
    .plan small { grid-column: 1; font-size: 14px; color: var(--muted); }

    .modes { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 4px; }
    .modes label { position: relative; }
    .modes input { position: absolute; opacity: 0; }
    .modes span { display: block; text-align: center; padding: 13px 8px; border: 1.5px solid var(--navy); border-radius: 12px; font-weight: 600; background: #fff; cursor: pointer; }
    .modes input:checked + span { background: var(--navy); color: #fff; }
    .modes input:focus-visible + span { outline: 2px solid var(--coral); outline-offset: 2px; }
    button[type=submit] { margin-top: 6px; width: 100%; padding: 18px; border: 0; border-radius: 14px; background: var(--green); color: #fff; font: 700 17px/1 "Inter", sans-serif; cursor: pointer; }
    button[type=submit]:hover { background: #17633e; }
    .note { margin: 0; text-align: center; font-size: 14px; color: var(--coral); font-weight: 700; }
    footer { background: var(--navy); color: #c9cede; font-size: 14px; padding: 20px 0 28px; }
    .present-hint { display: none; }
    .bar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 5; background: #fff; border-top: 1px solid var(--line); box-shadow: 0 -6px 20px rgba(0,0,0,.06); padding: 12px 0 calc(12px + env(safe-area-inset-bottom)); }
    .bar .wrap { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .bar p { margin: 0; font-size: 14px; color: var(--muted); line-height: 1.3; }
    .bar b { display: block; color: var(--coral); font-size: 15px; }
    .bar button { width: auto; margin: 0; padding: 14px 22px; }
    footer { padding-bottom: 100px !important; }
    footer a { color: var(--yellow); text-decoration: none; font-weight: 600; }
