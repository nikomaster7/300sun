<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1400 330" role="img" aria-label="Your cruise day in five steps: your ship docks, a taxi I book for you, the old town on foot, something real to eat, back on board on time">
  <!-- Draft, 2026-10-09. Hand-sketch look: plain line drawings pushed slightly out of true by two noise filters. -->
  <defs>
    <filter id="hand1" x="-5%" y="-5%" width="110%" height="110%"><feTurbulence type="fractalNoise" baseFrequency="0.03" numOctaves="2" seed="3"/><feDisplacementMap in="SourceGraphic" scale="7"/></filter>
    <filter id="hand2" x="-5%" y="-5%" width="110%" height="110%"><feTurbulence type="fractalNoise" baseFrequency="0.05" numOctaves="2" seed="11"/><feDisplacementMap in="SourceGraphic" scale="9"/></filter>
    <g id="ship">
      <path d="M20 200 L222 200 L198 232 L44 232 Z"/>
      <path d="M48 200 V178 H182 L198 200"/>
      <path d="M70 178 V160 H152 L166 178"/>
      <path d="M100 160 L104 134 H126 L130 160"/>
      <path d="M62 189 H176" stroke-dasharray="1 13"/>
      <path d="M84 169 H146" stroke-dasharray="1 13"/>
      <path d="M8 248 q10 -7 20 0 t20 0 t20 0 M128 252 q10 -7 20 0 t20 0 t20 0 t20 0"/>
    </g>
    <g id="lines" fill="none" stroke="#1a1a1a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
      <!-- 1. Ship -->
      <g transform="translate(20 0)"><use xlink:href="#ship"/></g>
      <!-- 2. Taxi -->
      <g transform="translate(300 0)">
        <path d="M30 216 V196 Q30 189 40 187 L72 182 L90 160 Q94 156 102 156 H150 Q158 156 162 162 L176 184 L202 188 Q212 190 212 198 V216 Z"/>
        <path d="M96 164 H122 V182 H82 Z M132 164 H150 L162 182 H132 Z"/>
        <circle cx="72" cy="217" r="14" fill="#f5f5f3"/><circle cx="72" cy="217" r="4"/>
        <circle cx="172" cy="217" r="14" fill="#f5f5f3"/><circle cx="172" cy="217" r="4"/>
        <path d="M8 233 H232"/>
      </g>
      <!-- 3. Torres de Serranos -->
      <g transform="translate(580 0)">
        <path d="M32 232 V112 M32 112 V98 H44 V108 H56 V98 H68 V108 H80 V98 H92 V112 M92 112 V232"/>
        <path d="M150 232 V112 M150 112 V98 H162 V108 H174 V98 H186 V108 H198 V98 H210 V112 M210 112 V232"/>
        <path d="M92 142 V132 H104 V142 H116 V132 H128 V142 H140 V132 H150"/>
        <path d="M104 232 V192 Q121 164 138 192 V232"/>
        <path d="M32 150 H92 M150 150 H210"/>
        <path d="M55 190 v-14 q7 -10 14 0 v14 M173 190 v-14 q7 -10 14 0 v14"/>
        <path d="M8 233 H232"/>
      </g>
      <!-- 4. Paella -->
      <g transform="translate(860 0)">
        <ellipse cx="120" cy="198" rx="82" ry="26"/>
        <ellipse cx="120" cy="198" rx="68" ry="19"/>
        <path d="M38 200 q4 26 82 28 q78 -2 82 -28"/>
        <path d="M40 194 q-22 -4 -20 8 q10 8 20 2 M200 194 q22 -4 20 8 q-10 8 -20 2"/>
        <path d="M96 158 q-9 -11 0 -22 q9 -11 0 -22 M122 154 q-9 -11 0 -22 q9 -11 0 -22 M148 158 q-9 -11 0 -22 q9 -11 0 -22"/>
        <path d="M92 196 l8 -3 M118 204 l9 2 M140 194 l8 3 M104 190 l6 4 M150 203 l-7 2"/>
      </g>
      <!-- 5. Back on board -->
      <g transform="translate(1380 0) scale(-1 1)"><use xlink:href="#ship"/></g>
      <g transform="translate(1140 0)"><circle cx="46" cy="124" r="24"/><path d="M46 110 V124 L57 131"/></g>
    </g>
    <g id="arrows" fill="none" stroke="#8a5a12" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
      <path d="M262 206 q18 -14 36 0 m-11 -9 l11 9 l-13 5"/>
      <path d="M542 206 q18 -14 36 0 m-11 -9 l11 9 l-13 5"/>
      <path d="M822 206 q18 -14 36 0 m-11 -9 l11 9 l-13 5"/>
      <path d="M1102 206 q18 -14 36 0 m-11 -9 l11 9 l-13 5"/>
    </g>
  </defs>
  <rect width="1400" height="330" fill="#f5f5f3"/>
  <!-- Loose washes of the sun colour, set a little off the lines as a painter would -->
  <g fill="#e9a23b" opacity=".9" filter="url(#hand2)">
    <circle cx="214" cy="118" r="24"/>
    <rect x="408" y="140" width="34" height="14" rx="3"/>
    <path d="M618 236 V118 H676 V236 Z" opacity=".55"/>
    <ellipse cx="984" cy="200" rx="64" ry="17"/>
    <path d="M1168 204 H1366 L1344 234 H1190 Z" opacity=".55"/>
  </g>
  <g stroke="#e9a23b" stroke-width="7" stroke-linecap="round" filter="url(#hand1)">
    <path d="M178 96 L160 78 M214 82 V58 M250 96 L268 78"/>
  </g>
  <use xlink:href="#lines" filter="url(#hand1)"/>
  <use xlink:href="#lines" filter="url(#hand2)" opacity=".45"/>
  <use xlink:href="#arrows" filter="url(#hand1)"/>
  <g font-family="'Instrument Serif', Georgia, 'Times New Roman', serif" font-style="italic" font-size="25" fill="#1a1a1a" text-anchor="middle">
    <text x="140" y="296">Your ship docks</text>
    <text x="420" y="296">A taxi I book for you</text>
    <text x="700" y="296">The old town, on foot</text>
    <text x="980" y="296">Something real to eat</text>
    <text x="1260" y="296">Back on board, on time</text>
  </g>
</svg>
