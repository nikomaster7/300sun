<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>300sun · avatar</title>
<!-- Square profile picture, 1080 x 1080, symbol only. Open with ?light (sun symbol on paper) or ?sunny (ink symbol on sun).
     Rebuild: Chrome headless, window 1080x1080, screenshot to brand/300sun-avatar-light-1080.png / -sunny-1080.png -->
<style>
  html, body { margin: 0; width: 1080px; height: 1080px; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center; background: #f5f5f3; }
  body.sunny { background: #e9a23b; }
  img { height: 600px; margin-left: 22px; }
</style>
</head>
<body>
  <img id="i" src="../../brand/300sun-symbol.svg" alt="">
  <script>if (location.search.indexOf("sunny") > -1) { document.body.className = "sunny"; document.getElementById("i").src = "../../brand/300sun-symbol-ink.svg"; }</script>
</body>
</html>
